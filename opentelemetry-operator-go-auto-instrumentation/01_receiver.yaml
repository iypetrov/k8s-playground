---
apiVersion: v1
kind: Namespace
metadata:
  name: receiver
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: auto-instrumentation-receiver
  namespace: receiver
spec:
  image: jaegertracing/jaeger:latest
  ports:
  - name: jaeger-ui
    port: 16686
  config:
    extensions:
      jaeger_storage:
        backends:
          memstore:
            memory:
              max_traces: 100000
      jaeger_query:
        storage:
          traces: memstore
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      jaeger_storage_exporter:
        trace_storage: memstore
    service:
      extensions: [jaeger_storage, jaeger_query]
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [jaeger_storage_exporter]
