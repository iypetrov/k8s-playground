---
apiVersion: v1
kind: Namespace
metadata:
  name: batch-job
---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: batch-job-auto-instrumentation
  namespace: batch-job
spec:
  exporter:
    endpoint: http://auto-instrumentation-receiver-collector.receiver.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch-job
  namespace: batch-job
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: batch-job
          annotations:
            instrumentation.opentelemetry.io/inject-go: 'true'
            instrumentation.opentelemetry.io/otel-go-auto-target-exe: '/bin/main'
        spec:
          restartPolicy: Never
          containers:
          - image: batch-job:latest
            imagePullPolicy: Never
            name: batch-job
            securityContext:
              privileged: true
              runAsUser: 0
