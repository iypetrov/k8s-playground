---
apiVersion: v1
kind: Namespace
metadata:
  name: http-server
---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: http-server-auto-instrumentation
  namespace: http-server
spec:
  exporter:
    endpoint: http://auto-instrumentation-receiver-collector.receiver.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-server
  namespace: http-server
  labels:
    app: http-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-server
  template:
    metadata:
      labels:
        app: http-server
      annotations:
        instrumentation.opentelemetry.io/inject-go: 'true'
        instrumentation.opentelemetry.io/otel-go-auto-target-exe: '/bin/main'
    spec:
      containers:
      - image: http-server:latest
        imagePullPolicy: Never
        name: http-server
        ports:
        - containerPort: 8080
        securityContext:
          privileged: true
          runAsUser: 0
---
apiVersion: v1
kind: Service
metadata:
  name: http-server
  namespace: http-server
spec:
  selector:
    app: http-server
  ports:
  - port: 8080
    targetPort: 8080
