---
apiVersion: v1
kind: Namespace
metadata:
  name: perses
---
apiVersion: perses.dev/v1alpha2
kind: Perses
metadata:
  name: perses
  namespace: perses
spec:
  config:
    database:
      file:
        folder: /perses
        extension: yaml
---
apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: prometheus
  namespace: perses
spec:
  config:
    default: true
    display:
      name: Prometheus
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: http://prometheus.monitoring.svc.cluster.local:9090
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: otel-pipeline
  namespace: perses
spec:
  config:
    display:
      name: OTel Pipeline
      description: OpenTelemetry collector pipeline metrics for the experiment namespace
    duration: 1h
    panels:
      fluentbitOutputSentRate:
        kind: Panel
        spec:
          display:
            name: Sent (records/s)
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: decimal
                  shortValues: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{name}}"
                  query: rate(fluentbit_output_proc_records_total{name=~"opentelemetry.*"}[5m])
      fluentbitOutputErrors:
        kind: Panel
        spec:
          display:
            name: Output Errors (/s)
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{name}}"
                  query: rate(fluentbit_output_errors_total{name=~"opentelemetry.*"}[5m])
      fluentbitOutputRetries:
        kind: Panel
        spec:
          display:
            name: Retries (/s)
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{name}}"
                  query: rate(fluentbit_output_retries_total{name=~"opentelemetry.*"}[5m])
      fluentbitOutputDropped:
        kind: Panel
        spec:
          display:
            name: Dropped Records (/s)
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{name}}"
                  query: rate(fluentbit_output_dropped_records_total{name=~"opentelemetry.*"}[5m])

    layouts:
    - kind: Grid
      spec:
        display:
          title: Fluent Bit Exporter
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 6
          content:
            $ref: '#/spec/panels/fluentbitOutputSentRate'
        - x: 12
          y: 0
          width: 12
          height: 6
          content:
            $ref: '#/spec/panels/fluentbitOutputErrors'
        - x: 0
          y: 6
          width: 12
          height: 6
          content:
            $ref: '#/spec/panels/fluentbitOutputRetries'
        - x: 12
          y: 6
          width: 12
          height: 6
          content:
            $ref: '#/spec/panels/fluentbitOutputDropped'
