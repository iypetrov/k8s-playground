---
apiVersion: v1
kind: Namespace
metadata:
  name: perses
---
apiVersion: perses.dev/v1alpha2
kind: Perses
metadata:
  name: perses
  namespace: perses
spec:
  config:
    database:
      file:
        folder: /perses
        extension: yaml
---
apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: prometheus
  namespace: perses
spec:
  config:
    default: true
    display:
      name: Prometheus
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: http://prometheus.monitoring.svc.cluster.local:9090
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: otel-pipeline
  namespace: perses
spec:
  config:
    display:
      name: OTel Pipeline
      description: OpenTelemetry collector pipeline metrics for the experiment namespace
    duration: 1h
    panels:
      fluentbitOutputSentRate:
        kind: Panel
        spec:
          display:
            name: Sent (records/s)
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: decimal
                  shortValues: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{pod}}"
                  query: rate(fluentbit_output_proc_records_total{name=~"opentelemetry.*"}[5m])
      fluentbitOutputErrors:
        kind: Panel
        spec:
          display:
            name: Output Errors (/s)
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: decimal
                  shortValues: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{pod}}"
                  query: rate(fluentbit_output_errors_total{name=~"opentelemetry.*"}[5m])
      fluentbitOutputRetries:
        kind: Panel
        spec:
          display:
            name: Retries (/s)
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: decimal
                  shortValues: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{pod}}"
                  query: rate(fluentbit_output_retries_total{name=~"opentelemetry.*"}[5m])
      fluentbitOutputDropped:
        kind: Panel
        spec:
          display:
            name: Dropped Records (/s)
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: decimal
                  shortValues: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{pod}}"
                  query: rate(fluentbit_output_dropped_records_total{name=~"opentelemetry.*"}[5m])
      kubeRbacProxyNetworkReceive:
        kind: Panel
        spec:
          display:
            name: Network Received (bytes/s)
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: bytes/sec
                  shortValues: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{pod}}"
                  query: rate(process_network_receive_bytes_total{instance=~".*:6969"}[5m])
      kubeRbacProxyNetworkTransmit:
        kind: Panel
        spec:
          display:
            name: Network Transmitted (bytes/s)
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: bytes/sec
                  shortValues: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{pod}}"
                  query: rate(process_network_transmit_bytes_total{instance=~".*:6969"}[5m])
      kubeRbacProxyMemory:
        kind: Panel
        spec:
          display:
            name: Memory (RSS)
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: bytes
                  shortValues: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{pod}}"
                  query: process_resident_memory_bytes{instance=~".*:6969"}
      kubeRbacProxyGoroutines:
        kind: Panel
        spec:
          display:
            name: Goroutines
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: decimal
                  shortValues: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{pod}}"
                  query: go_goroutines{instance=~".*:6969"}
      receiverAcceptedRate:
        kind: Panel
        spec:
          display:
            name: Accepted (records/s)
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: decimal
                  shortValues: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{receiver}}"
                  query: rate(otelcol_receiver_accepted_log_records[5m])
      receiverRefusedRate:
        kind: Panel
        spec:
          display:
            name: Refused (records/s)
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: decimal
                  shortValues: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{receiver}}"
                  query: rate(otelcol_receiver_refused_log_records[5m])
      receiverFailedRate:
        kind: Panel
        spec:
          display:
            name: Failed (records/s)
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: decimal
                  shortValues: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{receiver}}"
                  query: rate(otelcol_receiver_failed_log_records[5m])

    layouts:
    - kind: Grid
      spec:
        display:
          title: Fluent Bit Exporter
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 6
          content:
            $ref: '#/spec/panels/fluentbitOutputSentRate'
        - x: 12
          y: 0
          width: 12
          height: 6
          content:
            $ref: '#/spec/panels/fluentbitOutputErrors'
        - x: 0
          y: 6
          width: 12
          height: 6
          content:
            $ref: '#/spec/panels/fluentbitOutputRetries'
        - x: 12
          y: 6
          width: 12
          height: 6
          content:
            $ref: '#/spec/panels/fluentbitOutputDropped'
    - kind: Grid
      spec:
        display:
          title: Kube RBAC Proxy
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 6
          content:
            $ref: '#/spec/panels/kubeRbacProxyNetworkReceive'
        - x: 12
          y: 0
          width: 12
          height: 6
          content:
            $ref: '#/spec/panels/kubeRbacProxyNetworkTransmit'
        - x: 0
          y: 6
          width: 12
          height: 6
          content:
            $ref: '#/spec/panels/kubeRbacProxyMemory'
        - x: 12
          y: 6
          width: 12
          height: 6
          content:
            $ref: '#/spec/panels/kubeRbacProxyGoroutines'
    - kind: Grid
      spec:
        display:
          title: OTel Receiver
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 8
          height: 6
          content:
            $ref: '#/spec/panels/receiverAcceptedRate'
        - x: 8
          y: 0
          width: 8
          height: 6
          content:
            $ref: '#/spec/panels/receiverRefusedRate'
        - x: 16
          y: 0
          width: 8
          height: 6
          content:
            $ref: '#/spec/panels/receiverFailedRate'
