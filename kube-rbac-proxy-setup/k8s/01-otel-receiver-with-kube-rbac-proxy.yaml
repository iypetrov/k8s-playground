---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-rbac-proxy
  namespace: experiment
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-rbac-proxy
rules:
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
- apiGroups: ["authorization.k8s.io"]
  resources: ["subjectaccessreviews"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-rbac-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-rbac-proxy
subjects:
- kind: ServiceAccount
  name: kube-rbac-proxy
  namespace: experiment
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: experiment
data:
  config.yaml: |
    receivers:
      otlp/http:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

    exporters:
      debug:
        verbosity: detailed

    service:
      pipelines:
        logs/0:
          receivers: [otlp/http]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-receiver
  namespace: experiment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-receiver
  template:
    metadata:
      labels:
        app: otel-receiver
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: kube-rbac-proxy
      initContainers:
      - name: kube-rbac-proxy
        image: quay.io/brancz/kube-rbac-proxy:v0.22.1
        args:
        - "--secure-listen-address=0.0.0.0:8443"
        - "--upstream=http://localhost:4318/"
        - "--tls-cert-file=/tls/tls.crt"
        - "--tls-private-key-file=/tls/tls.key"
        - "--logtostderr=true"
        - "--v=10"
        ports:
        - containerPort: 8443
          name: https
        restartPolicy: Always
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector:latest
        args:
          - "--config=/etc/otelcol/config.yaml"
        ports:
          - name: otlp-http
            containerPort: 4318
        volumeMounts:
          - name: otel-config
            mountPath: /etc/otelcol
      volumes:
        - name: otel-config
          configMap:
            name: otel-collector-config
        - name: tls
          secret:
            secretName: otel-receiver-tls
---
apiVersion: v1
kind: Service
metadata:
  name: otel-receiver
  namespace: experiment
spec:
  ports:
  - name: https
    port: 8443
    targetPort: https
  selector:
    app: otel-receiver
