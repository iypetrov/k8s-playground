---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-exporter
  namespace: experiment
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-exporter
rules:
- nonResourceURLs: ["/v1/logs"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-exporter
subjects:
- kind: ServiceAccount
  name: otel-exporter
  namespace: experiment
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-exporter
  namespace: experiment
spec:
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.159.0
  serviceAccount: otel-exporter

  volumes:
  - name: logdir
    emptyDir: {}

  initContainers:
  - name: log-generator
    image: busybox
    restartPolicy: Always
    command:
    - /bin/sh
    - -c
    - |
      while true; do
        echo "$(date -Iseconds) hello from log-generator" >> /logs/gen.log
        sleep 0.2  # ~5 lines/sec; adjust to control rate
      done
    volumeMounts:
    - name: logdir
      mountPath: /logs

  config:
    receivers:
      filelog:
        include: [/logs/gen.log]
        start_at: end

    exporters:
      otlphttp:
        endpoint: https://kube-rbac-proxy.experiment.svc.cluster.local:8443
        tls:
          insecure_skip_verify: true
        headers:
          Authorization: "Bearer ${file:/var/run/secrets/kubernetes.io/serviceaccount/token}"

    service:
      pipelines:
        logs/0:
          receivers: [filelog]
          exporters: [otlphttp]

  volumeMounts:
  - name: logdir
    mountPath: /logs
