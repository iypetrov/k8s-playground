---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-exporter
  namespace: experiment
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-exporter
rules:
- nonResourceURLs: ["/opentelemetry.proto.collector.logs.v1.LogsService/Export"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-exporter
subjects:
- kind: ServiceAccount
  name: otel-exporter
  namespace: experiment
---
apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: otel-exporter
  namespace: experiment
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceAccount: otel-exporter
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.159.0
  ports:
  - name: metrics
    port: 8888
  initContainers:
  - name: log-generator
    image: busybox:latest
    restartPolicy: Always
    command:
    - /bin/sh
    - -c
    - while true; do echo "$(date -Iseconds) INFO sample log line $RANDOM"; sleep 0.1; done >> /logs/gen.log
    volumeMounts:
    - name: logdir
      mountPath: /logs
  volumeMounts:
  - name: logdir
    mountPath: /logs
  - name: tls
    mountPath: /tls
    readOnly: true
  volumes:
  - name: logdir
    emptyDir: {}
  - name: tls
    secret:
      secretName: otel-receiver-tls
  config: |
    receivers:
      filelog:
        include: [/logs/gen.log]
        start_at: end

    exporters:
      otlp:
        endpoint: otel-receiver.experiment.svc.cluster.local:8443
        tls:
          ca_file: /tls/ca.crt
        headers:
          Authorization: "Bearer ${file:/var/run/secrets/kubernetes.io/serviceaccount/token}"

    service:
      telemetry:
        metrics:
          readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
      pipelines:
        logs/0:
          receivers: [filelog]
          exporters: [otlp]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-exporter
  namespace: experiment
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-exporter-collector
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
