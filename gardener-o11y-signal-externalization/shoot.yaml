---
apiVersion: core.gardener.cloud/v1beta1
kind: Shoot
metadata:
  name: local
  namespace: garden-local
  annotations:
    shoot.gardener.cloud/cloud-config-execution-max-delay-seconds: "0"
    authentication.gardener.cloud/issuer: "managed"
spec:
  extensions:
    - type: otelcol
      providerConfig:
        apiVersion: otelcol.extensions.gardener.cloud/v1alpha1
        kind: CollectorConfig
        spec:
          logs:
            level: INFO
            encoding: console
          metrics:
            level: normal
          targets:
            - exporter:
                otlp_http:
                  # The Envoy LoadBalancer IP is the only address reachable from
                  # the seed AND allow-listed by the shoot's allow-machine-pods
                  # NetworkPolicy. Must match the IP SAN in the server cert
                  # (scripts/generate-certificates.sh).
                  endpoint: "https://172.18.255.227:4318"
                  compression: gzip
                  encoding: proto
                  token:
                    resourceRef:
                      name: hyperdx-otelcol-bearer-token
                      dataKey: token
                  tls:
                    ca:
                      resourceRef:
                        name: hyperdx-otelcol-tls
                        dataKey: ca.crt
                    cert:
                      resourceRef:
                        name: hyperdx-otelcol-tls
                        dataKey: client.crt
                    key:
                      resourceRef:
                        name: hyperdx-otelcol-tls
                        dataKey: client.key
              signals: [logs]
              filters:
                error_mode: propagate
                log_conditions:
                  - conditions:
                      - resource.attributes["gardener.project.name"] == "local"
  resources:
    - name: hyperdx-otelcol-bearer-token
      resourceRef:
        apiVersion: v1
        kind: Secret
        name: hyperdx-otelcol-bearer-token
    - name: hyperdx-otelcol-tls
      resourceRef:
        apiVersion: v1
        kind: Secret
        name: hyperdx-otelcol-tls
  cloudProfile:
    name: local
    kind: CloudProfile
  credentialsBindingName: local # dummy, doesn't contain any credentials
  region: local
  networking:
    type: calico
    # Must be within 10.0.0.0/16 (subnet of kind pod CIDR 10.0.0.0/15, but disjoint with seed pod CIDR 10.1.0.0/16).
    nodes: 10.0.0.0/16
  provider:
    type: local
    workers:
      - name: local
        machine:
          type: local
        cri:
          name: containerd
        minimum: 1
        maximum: 2
        maxSurge: 1
        maxUnavailable: 0
  kubernetes:
    kubelet:
      seccompDefault: true
      serializeImagePulls: false
      registryPullQPS: 10
      registryBurst: 20
      protectKernelDefaults: true
      streamingConnectionIdleTimeout: 5m
