---
apiVersion: core.gardener.cloud/v1beta1
kind: Shoot
metadata:
  name: local
  namespace: garden-local
  annotations:
    shoot.gardener.cloud/cloud-config-execution-max-delay-seconds: "0"
    authentication.gardener.cloud/issuer: "managed"
spec:
  extensions:
    - type: otelcol
      providerConfig:
        apiVersion: otelcol.extensions.gardener.cloud/v1alpha1
        kind: CollectorConfig
        spec:
          logs:
            level: INFO
            encoding: console
          metrics:
            level: normal
          targets:
            - exporter:
                otlp_http:
                  endpoint: "http://172.18.255.227:4318"
                  compression: gzip
                  headers:
                    # HyperDX ingestion API key. Bare token, no "Bearer" prefix.
                    # Regenerated by clickstack-app on each redeploy; read via:
                    #   ks -n clickstack exec deploy/clickstack-otel-collector -- \
                    #     grep -A2 'tokens:' /etc/otel/supervisor-data/effective.yaml
                    authorization: "25c56b23-f214-4b21-bf01-b3890eea97e4"
              signals: [logs]
  cloudProfile:
    name: local
    kind: CloudProfile
  credentialsBindingName: local # dummy, doesn't contain any credentials
  region: local
  networking:
    type: calico
    # Must be within 10.0.0.0/16 (subnet of kind pod CIDR 10.0.0.0/15, but disjoint with seed pod CIDR 10.1.0.0/16).
    nodes: 10.0.0.0/16
  provider:
    type: local
    workers:
      - name: local
        machine:
          type: local
        cri:
          name: containerd
        minimum: 1
        maximum: 2
        maxSurge: 1
        maxUnavailable: 0
  kubernetes:
    kubelet:
      seccompDefault: true
      serializeImagePulls: false
      registryPullQPS: 10
      registryBurst: 20
      protectKernelDefaults: true
      streamingConnectionIdleTimeout: 5m
