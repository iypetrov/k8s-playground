---
# Gardener shoots ship a default-deny posture for cross-namespace pod traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloudflared-to-hyperdx
  namespace: clickstack
spec:
  podSelector:
    matchLabels:
      app: clickstack
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cloudflared
    ports:
    - protocol: TCP
      port: 3000
