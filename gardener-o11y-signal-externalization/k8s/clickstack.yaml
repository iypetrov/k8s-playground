---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcp-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tcp-server
  template:
    metadata:
      labels:
        app: tcp-server
    spec:
      containers:
        - name: tcp-server
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              while true; do
                echo "Hello from Kubernetes TCP server" | nc -l -p 8080
              done
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: tcp-server
  namespace: default
spec:
  selector:
    app: tcp-server
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
