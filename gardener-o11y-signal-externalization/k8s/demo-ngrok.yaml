---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tinyllama
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tinyllama
  template:
    metadata:
      labels:
        app: tinyllama
    spec:
      containers:
        - name: tinyllama
          image: ghcr.io/ngrok-samples/tinyllama:main
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: tinyllama
  namespace: default
spec:
  selector:
    app: tinyllama
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tinyllama
  namespace: default
  annotations:
    k8s.ngrok.com/traffic-policy: strip-tinyllama
spec:
  ingressClassName: ngrok
  rules:
    - host: "guy-multiflorous-semaj.ngrok-free.dev"
      http:
        paths:
          - path: /tinyllama
            pathType: Prefix
            backend:
              service:
                name: tinyllama
                port:
                  number: 80
---
apiVersion: ngrok.k8s.ngrok.com/v1alpha1
kind: NgrokTrafficPolicy
metadata:
  name: strip-tinyllama
  namespace: default
spec:
  policy:
    on_http_request:
      - actions:
          - type: url-rewrite
            config:
              from: ^/tinyllama(/.*)?$
              to: ${1}
