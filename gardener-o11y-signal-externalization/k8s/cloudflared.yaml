---
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflared
  labels:
    kubernetes.io/metadata.name: cloudflared
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    ingress:
      - hostname: clickstack.ip812.com
        service: http://clickstack-app.clickstack.svc.cluster.local:3000
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
      - name: cloudflared
        image: "cloudflare/cloudflared:2026.7.3"
        args:
        - "tunnel"
        - "--config"
        - "/etc/cloudflared/config/config.yaml"
        - "run"
        - "--protocol"
        - "http2"
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-creds
              key: TUNNEL_TOKEN
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
        livenessProbe:
          httpGet:
            path: /ready
            port: 20241
          failureThreshold: 1
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: cloudflared-config
